version: "3.8"

services:
  frontend:
    build: ./frontend
    container_name: chat-frontend
    expose:
      - "3000"  # Only exposed to NGINX, not externally
    environment:
      - NEXT_PUBLIC_BACKEND_URL=http://backend:5000
    restart: always

  backend:
    build: ./backend
    container_name: chat-backend
    expose:
      - "5000"  # Only exposed to NGINX, not externally
    env_file:
      - ./backend/.env
    restart: always

  nginx:
    image: nginx:latest
    container_name: chat-nginx
    ports:
      - "80:80"  # Exposing port 80 for HTTP traffic
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend
    restart: always
