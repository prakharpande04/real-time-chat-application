version: "3.8"

services:
  frontend:
    build: ./frontend
    container_name: chat-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_BACKEND_URL=http://backend:5000
    restart: always

  backend:
    build: ./backend
    container_name: chat-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    restart: always
